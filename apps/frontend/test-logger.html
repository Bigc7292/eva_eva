<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleLogger Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .log-container {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
        }
        .log-entry {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .info { color: blue; }
        .warn { color: orange; }
        .error { color: red; }
        .debug { color: gray; }
        .button-container {
            margin-top: 20px;
        }
        button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>SimpleLogger Test</h1>
    
    <div class="button-container">
        <button id="logInfo">Log Info</button>
        <button id="logWarn">Log Warning</button>
        <button id="logError">Log Error</button>
        <button id="logDebug">Log Debug</button>
        <button id="clearLogs">Clear Logs</button>
    </div>
    
    <div class="log-container" id="logContainer"></div>
    
    <script>
        // Define log entry type
        class LogEntry {
            constructor(timestamp, level, message, details) {
                this.timestamp = timestamp;
                this.level = level;
                this.message = message;
                this.details = details;
            }
        }
        
        // Global log collection
        let globalLogs = [];
        
        // Create a global logger function
        const simpleLogger = {
            info: (message, details) => {
                const entry = new LogEntry(new Date(), 'info', message, details);
                globalLogs.push(entry);
                console.info(`[SIMPLE-LOGGER][INFO] ${message}`, details || '');
                window.dispatchEvent(new CustomEvent('app-log', { detail: entry }));
            },
            warn: (message, details) => {
                const entry = new LogEntry(new Date(), 'warn', message, details);
                globalLogs.push(entry);
                console.warn(`[SIMPLE-LOGGER][WARN] ${message}`, details || '');
                window.dispatchEvent(new CustomEvent('app-log', { detail: entry }));
            },
            error: (message, details) => {
                const entry = new LogEntry(new Date(), 'error', message, details);
                globalLogs.push(entry);
                console.error(`[SIMPLE-LOGGER][ERROR] ${message}`, details || '');
                window.dispatchEvent(new CustomEvent('app-log', { detail: entry }));
            },
            debug: (message, details) => {
                const entry = new LogEntry(new Date(), 'debug', message, details);
                globalLogs.push(entry);
                console.debug(`[SIMPLE-LOGGER][DEBUG] ${message}`, details || '');
                window.dispatchEvent(new CustomEvent('app-log', { detail: entry }));
            },
            getLogs: () => [...globalLogs],
            clear: () => {
                globalLogs = [];
                window.dispatchEvent(new CustomEvent('app-logs-cleared'));
            }
        };
        
        // DOM elements
        const logContainer = document.getElementById('logContainer');
        const logInfoBtn = document.getElementById('logInfo');
        const logWarnBtn = document.getElementById('logWarn');
        const logErrorBtn = document.getElementById('logError');
        const logDebugBtn = document.getElementById('logDebug');
        const clearLogsBtn = document.getElementById('clearLogs');
        
        // Event listeners
        logInfoBtn.addEventListener('click', () => {
            simpleLogger.info('Info log test', { timestamp: new Date().toISOString() });
        });
        
        logWarnBtn.addEventListener('click', () => {
            simpleLogger.warn('Warning log test', { timestamp: new Date().toISOString() });
        });
        
        logErrorBtn.addEventListener('click', () => {
            simpleLogger.error('Error log test', { timestamp: new Date().toISOString() });
        });
        
        logDebugBtn.addEventListener('click', () => {
            simpleLogger.debug('Debug log test', { timestamp: new Date().toISOString() });
        });
        
        clearLogsBtn.addEventListener('click', () => {
            simpleLogger.clear();
        });
        
        // Handler for new logs
        const handleNewLog = (event) => {
            const log = event.detail;
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${log.level}`;
            
            const timestamp = log.timestamp.toLocaleTimeString() + '.' + log.timestamp.getMilliseconds().toString().padStart(3, '0');
            
            logEntry.innerHTML = `
                <div>
                    <span class="${log.level}">${log.level.toUpperCase()}</span>
                    <span style="float: right; font-size: 0.8em;">${timestamp}</span>
                </div>
                <p>${log.message}</p>
                ${log.details ? `<pre>${JSON.stringify(log.details, null, 2)}</pre>` : ''}
            `;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        };
        
        // Handler for clearing logs
        const handleClearLogs = () => {
            logContainer.innerHTML = '';
        };
        
        // Add event listeners
        window.addEventListener('app-log', handleNewLog);
        window.addEventListener('app-logs-cleared', handleClearLogs);
        
        // Log initial environment information
        simpleLogger.info('Logger initialized', {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language
        });
    </script>
</body>
</html>
