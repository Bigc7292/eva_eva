server {
    listen 80;
    server_name _;

    # Increase max request size for audio files
    client_max_body_size 20M;

    # Logging configuration
    access_log /var/log/nginx/vapi_access.log;
    error_log /var/log/nginx/vapi_error.log;

    # Proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Vapi webhook endpoint
    location /vapi/webhook {
        # Forward to backend service
        proxy_pass http://backend:3001/api/vapi/webhook;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # n8n webhook endpoint
    location /n8n/webhook {
        # Forward to n8n service
        proxy_pass http://n8n:5678/webhook;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
